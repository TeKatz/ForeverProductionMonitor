name: Build public screenshot gallery

on:
  push:
    paths:
      - ".github/workflows/build-gallery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct gallery image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/images
          cat gallery_payload/part*.txt | base64 --decode > docs/images/feature-gallery.webp
          test "$(stat -c%s docs/images/feature-gallery.webp)" -eq 21204
          file docs/images/feature-gallery.webp | grep -q "Web/P image"

      - name: Commit gallery and remove temporary payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gallery_payload
          rm -f .github/workflows/build-gallery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/images/feature-gallery.webp gallery_payload .github/workflows/build-gallery.yml
          git commit -m "docs: add public screenshot gallery"
          git push
