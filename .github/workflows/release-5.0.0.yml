name: Release 5.0.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-5.0.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build release
        run: ./gradlew clean build --no-daemon

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/ForeverProductionMonitor-1.21.1-NeoForge-5.0.0.jar"
          test -f "$JAR"
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'version="5.0.0"'
          if unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'SNAPSHOT'; then
            echo "Release metadata still contains SNAPSHOT"
            exit 1
          fi

      - name: Prepare release notes
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Forever Production Monitor 5.0.0 is the largest feature release since the public 4.0.0 baseline.

          This release was manually validated in-game before publication.

          ## Crafting Diagnostics
          - Added a dedicated Crafting Diagnostics workspace for active jobs, patterns and providers.
          - Added direct crafting requests with additive amount controls.
          - Added pattern inputs/outputs, duplicate-output alternatives, provider details and reverse dependency inspection.
          - Added provider location handoff to the existing dimension-aware Network Map.
          - Added bounded, cycle-safe diagnostics snapshots with explicit partial-result handling.

          ## Themes and interface
          - Expanded and polished the visual theme system with richer identities and animations.
          - Reworked Cats, Carbon Industrial, Oritech, Forever, Mekanism, AE2 and Quantum presentation.
          - Added selected interactive theme elements, including the Cats theme eye tracking and click-heart reaction.
          - Added a full Custom Theme Designer with live preview, backgrounds, particles, tabs, buttons and animation styling.
          - Added a dedicated Custom Mini HUD Designer.
          - Removed the Aurora theme.

          ## Mini HUD
          - Reworked settings into General, Content, Layout and Appearance sections with a permanent live preview.
          - Added preview zoom controls and centered preview rendering.
          - Added filters for items, fluids, energy and infinite/creative storage.
          - Added stored-amount sorting for highest-first and lowest-first views.
          - Improved theme-aware framing and Custom Mini HUD styling.

          ## Compatibility
          - Minecraft 1.21.1
          - NeoForge 21.1.249+
          - Applied Energistics 2 19.2.17 up to, but not including, 20.0.0
          - Curios 9.5.1+
          - ExtendedAE remains optional.

          ## Development & AI disclosure
          Forever Production Monitor is designed, directed and tested by Timo. Implementation and asset development are produced extensively with generative AI (ChatGPT/OpenAI) under human direction, selection, review and in-game testing. Full details are documented in the repository README.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v5.0.0             "build/libs/ForeverProductionMonitor-1.21.1-NeoForge-5.0.0.jar"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Forever Production Monitor 5.0.0"             --notes-file /tmp/release-notes.md

      - name: Remove one-shot release workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-5.0.0.yml
          git commit -m "chore: remove 5.0.0 release workflow"
          git push origin HEAD:main
