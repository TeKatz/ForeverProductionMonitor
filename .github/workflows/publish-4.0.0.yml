name: Publish 4.0.0

on:
  push:
    paths:
      - ".github/workflows/publish-4.0.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: 383fcd216f12dcb4db116938d40e37f9d722159d

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build release JAR
        run: ./gradlew clean build --no-daemon

      - name: Verify release JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/ForeverProductionMonitor-1.21.1-NeoForge-4.0.0.jar"
          test -f "$JAR"
          sha256sum "$JAR"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          Forever Production Monitor 4.0.0 is the first public stable release of the project.

          This release has been manually validated in-game after the 4.0.0 stability, architecture and Network Map performance pass.

          ### Development & AI disclosure
          Forever Production Monitor is designed, directed and tested by Timo. The implementation has been produced extensively with generative AI (ChatGPT/OpenAI) under human direction and review. Full details are documented in the repository README.

          ### Changes
          EOF
          awk '
            /^## 4\.0\.0$/ { in_section=1; next }
            /^## Development history before 4\.0\.0$/ { in_section=0 }
            in_section { print }
          ' CHANGELOG.md >> /tmp/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v4.0.0 \
            "build/libs/ForeverProductionMonitor-1.21.1-NeoForge-4.0.0.jar" \
            --repo "${{ github.repository }}" \
            --target "383fcd216f12dcb4db116938d40e37f9d722159d" \
            --title "Forever Production Monitor 4.0.0" \
            --notes-file /tmp/release-notes.md
