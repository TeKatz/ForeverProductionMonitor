plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

group = 'de.timo.foreverproductionmonitor'
version = '3.3.1'
base.archivesName = 'ForeverProductionMonitor-1.21.1-NeoForge'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.theillusivec4.top/' }
}

neoForge {
    version = '21.1.249'
    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }
    mods {
        forever_production_monitor { sourceSet(sourceSets.main) }
    }
}

dependencies {
    implementation 'org.appliedenergistics:appliedenergistics2:19.2.17'
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
